# ES jalan di VM, bukan di cluster. Service tanpa selector + EndpointSlice
# bikin app di GKE bisa nembak http://elasticsearch:9200 tanpa hardcode IP VM.
# Ganti <VM_PRIVATE_IP> dan port-nya kalau ES_PORT di VM bukan 5003.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 5003
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: elasticsearch-vm
  labels:
    kubernetes.io/service-name: elasticsearch
addressType: IPv4
ports:
  - name: http
    port: 5003
    protocol: TCP
endpoints:
  - addresses:
      - "<VM_PRIVATE_IP>"
