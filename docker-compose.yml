services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      # ponytail: no TLS — traffic stays inside the VPC, auth is basic. Enable http.ssl if ES ever leaves the private network.
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${BIND_IP}:${ES_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # one-shot: give kibana_system its password so Kibana can log in
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    depends_on:
      elasticsearch: { condition: service_healthy }
    command: >
      curl -sf -u elastic:${ELASTIC_PASSWORD} -X POST
      http://elasticsearch:9200/_security/user/kibana_system/_password
      -H 'Content-Type: application/json'
      -d '{"password":"${KIBANA_PASSWORD}"}'
    restart: on-failure

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - "${BIND_IP}:${KIBANA_PORT}:5601"

volumes:
  esdata:
  kibanadata:
